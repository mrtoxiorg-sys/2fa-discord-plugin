# ========================================== #
#                2FA Config                  #
# ========================================== #


database:
  # Supported types: sqlite, mysql, postgresql
  type: "sqlite"

  # Connection settings (ignored when sqlite is used)
  host: "localhost"
  port: 3306
  database: "twofa"
  username: "root"
  password: ""
  use-ssl: false


discord:
  # Bot token
  token: "YOUR_BOT_TOKEN_HERE"

# Active locale. Available values: en_us, ru_ru
locale: "en_us"

# Player IP session lifetime in seconds.
# If the player reconnects from the same IP within this time, 2FA is not requested again.
# Default: 3600 seconds (1 hour).
session-duration-seconds: 3600

# Debug mode.
debug: false
