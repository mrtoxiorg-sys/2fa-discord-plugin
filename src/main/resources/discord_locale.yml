# ========================================== #
#          Aurion2FA Discord Locale          #
# ========================================== #

# Сообщение с запросом на подтверждение входа при подключении к серверу
auth-request:
  title: 🛡️ Запрос двухфакторной авторизации
  description: |-
    Игрок **%player%** пытается войти под вашим аккаунтом.

    **IP-Адрес:** `%ip%`

    *Если это не вы, незамедлительно примите меры безопасности!*
  color: '#FF9F4F' # Оранжевый цвет предупреждения
  buttons:
    approve: 🟢 Одобрить вход
    kick: 🟡 Кикнуть игрока
    block: 🔴 Заблокировать аккаунт

# Успешное выполнение связывания аккаунта (ЛС бота)
link-success:
  title: ✅ Аккаунт успешно привязан
  description: |-
    Поздравляем! Ваш игровой аккаунт Minecraft успешно привязан к вашей учетной записи Discord.

    Теперь ваш аккаунт находится под надежной защитой 2FA.
  color: '#4FD6FF'

# Ошибка при попытке отправить недействительный или просроченный код в ЛС бота
link-expired:
  title: ❌ Ошибка привязки
  description: |-
    Указанный код не найден или срок его действия (1 минута) уже истёк.

    Введите команду `/aurion2fa link` в игре снова, чтобы сгенерировать новый код.
  color: '#FF4F4F'

# Уведомление в ЛС при отвязке аккаунта администратором (/aurion2fa unlink)
unlink-notify:
  title: ⚠️ Защита 2FA отключена
  description: Администратор сервера отключил защиту двухфакторной аутентификации
    (2FA) для вашего игрового аккаунта.
  color: '#FFD700' # Желтый

# Уведомление в ЛС при разбане аккаунта администратором (/aurion2fa unban)
unban-notify:
  title: 🔓 Аккаунт разблокирован
  description: Администратор успешно снял блокировку входа с вашего игрового аккаунта.
    Теперь вы снова можете авторизоваться на сервере.
  color: '#32CD32' # Зеленый
