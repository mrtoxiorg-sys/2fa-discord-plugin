# ========================================== #
#             2FA Plugin Locale              #
# ========================================== #

# Префикс плагина, используемый в сообщениях
prefix: '<gradient:#4FD6FF:#D7F4FA>[2FA]</gradient> '

messages:
  # Общие системные сообщения и ошибки
  no-permission: '%prefix%<gradient:#FF4F4F:#FAD7D7>Ошибка →</gradient> <white>У вас
    нет прав!'
  only-players: <gradient:#FF4F4F:#FAD7D7>Ошибка →</gradient> <white>Эта команда доступна
    только игрокам!
  player-not-found: '%prefix%<gradient:#FF4F4F:#FAD7D7>Ошибка →</gradient> <white>Неизвестная
    подкоманда или игрок не найден.'
  configs-reloaded: '%prefix%<gradient:#4FD6FF:#D7F4FA>Успешно →</gradient> <white>Конфигурация
    плагина перезагружена!'

  # Включение защиты (/2fa enable)
  already-linked: '%prefix%<gradient:#FF4F4F:#FAD7D7>Ошибка →</gradient> <white>Ваш
    аккаунт уже привязан к Discord 2FA!'
  link-code-received: '%prefix%<gradient:#4FD6FF:#D7F4FA>Привязка →</gradient> <white>Ваш
    временный код: <gradient:#4FD6FF:#D7F4FA><bold>%code%</bold></gradient>. Отправьте
    его боту в личные сообщения. Действует 1 минуту.'
  link-success: '%prefix%<gradient:#4FD6FF:#D7F4FA>Привязка →</gradient> <white>Вы
    успешно связали этот аккаунт со своим Discord!'

  # Процесс двухфакторной авторизации при входе
  auth-required: '%prefix%<gradient:#FF9F4F:#FAD7A7>Внимание →</gradient> <white>Ваш
    аккаунт защищен. Подтвердите вход, нажав кнопку в личных сообщениях Discord!'
  auth-success: '%prefix%<gradient:#4FD6FF:#D7F4FA>Авторизация →</gradient> <white>Личность
    успешно подтверждена. Приятной игры!'
  actions-blocked: '%prefix%<gradient:#FF4F4F:#FAD7D7>Защита →</gradient> <white>Вы
    не можете совершать действия на сервере до подтверждения входа через Discord!'

  # Причины отключения (кика) от сервера
  banned-kick: |-
    <gradient:#FF4F4F:#FAD7D7>2FA</gradient>
    <white>Ваш игровой аккаунт временно <gradient:#FF4F4F:#FAD7D7>заблокирован владельцем через Discord 2FA.
    <gray>Для разблокировки обратитесь в поддержку.
  auth-kick-reason: |-
    <gradient:#FF4F4F:#FAD7D7>2FA</gradient>
    <gradient:#4FD6FF:#D7F4FA>Ваш вход на сервер был отклонен через 2FA дискорд бота.
  auth-kick-blocked: |-
    <gradient:#FF4F4F:#FAD7D7>2FA</gradient>

    <white>Вход на этот аккаунт был <gradient:#FF4F4F:#FAD7D7>заблокирован<white> через 2FA бота.
    <gray>Для разблокировки обратитесь в поддержку.
  dm-failed: |-
    <gradient:#FF4F4F:#FAD7D7>2FA</gradient>

    <white>Бот не смог отправить вам запрос авторизации.

    <gray>Пожалуйста, убедитесь, что у вас <yellow>открыты личные сообщения</yellow> для пользователей общего сервера Discord, и попробуйте войти снова.
  bot-not-ready: |-
    <gradient:#FF4F4F:#FAD7D7>2FA</gradient>

    <white>Система защиты 2FA еще запускается после старта сервера.

    <gray>Пожалуйста, подождите около минуты и попробуйте войти снова.
